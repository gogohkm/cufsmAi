# 0926 Phase 5: ruff 설정. E(문법/스타일 오류)·F(미사용/미정의)만 검사.
# 전체 트리에는 기존 이슈가 남아 있어 CI 게이트는 0926 작업 파일 목록에만 적용하고,
# 전체 정리는 후속 과제로 둔다 (0926코드개선방안.md §7 Phase 5).
[lint]
select = ["E", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# FSM 이식 코어 경계: bare-except·세미콜론 한줄복문(MATLAB 관용구)은 원형 유지 (0926 제외 영역)
"python/cfsm/*.py" = ["E722", "E702"]
