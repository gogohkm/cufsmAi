# 0926 Phase 5: PR 품질 게이트
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:webview
      - run: node --check webview/js/app.js && node --check webview/js/designState.js

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: pip install ruff
      - run: ruff check python/design/interaction.py python/design/global_buckling.py python/design/aisi_s100.py python/design/special_topics.py python/engine/dsm.py python/engine/helpers.py python/engine/stress.py test/python/test_regression_0926.py test/python/run_all.py
      - run: python test/python/run_all.py
